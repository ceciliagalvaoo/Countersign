<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Countersign figures</title>
<link rel="stylesheet" href="ink.css" />
<style>
  body { padding: 0; }
  .fig { display: block; margin: 0 0 40px; }
</style>
<script src="ink.js"></script>
<script src="figs.js"></script>
</head>
<body>
<div id="figs"></div>
<script>
const host = document.getElementById('figs');
for (const [id, fn] of Object.entries(FIGS)) {
  const div = document.createElement('div');
  div.className = 'fig'; div.id = id; div.innerHTML = fn();
  host.appendChild(div);
}
window.FIG_IDS = Object.keys(FIGS);
</script>
</body>
</html>
