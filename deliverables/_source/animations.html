<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Countersign · Animation lab</title>
<link rel="stylesheet" href="ink.css" />
<style>
  /* Each clip is a 1920x1080 frame. It holds its first frame until played, plays once, and freezes on its last. */
  body { margin: 0; background: #e9e3d4; }
  .clip { width: 1920px; height: 1080px; position: relative; overflow: hidden; background: var(--cream); margin: 0 0 40px; }
  .clip .label { position: absolute; top: 12px; left: 16px; font: 500 12px Inter, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-soft); }
  body.solo .clip { margin: 0; }
  body.solo .clip .label { display: none; }
  .fig { position: absolute; inset: 50px 120px 190px; display: flex; align-items: center; justify-content: center; }
  .fig svg { width: 100%; height: 100%; }
  .center { position: absolute; inset: 0 0 150px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 26px; }
  .pad { position: absolute; inset: 0; padding: 90px 230px 230px; display: flex; flex-direction: column; justify-content: center; }
  [data-s] { opacity: 0; }
  .tier { display: grid; grid-template-columns: 260px 1fr; align-items: center; padding: 26px 34px; border-radius: 6px; background: rgba(235,229,214,.75); border: 2px solid rgba(27,43,107,.12); }
  .tier + .tier { margin-top: 18px; }
  .tier b { font-family: var(--display); font-weight: 600; font-size: 54px; }
  .tier span { font-size: 32px; }
  .inc { padding: 40px 44px; border-radius: 6px; background: rgba(235,229,214,.75); border: 2px solid rgba(27,43,107,.12); }
  .inc .big { font-family: var(--display); font-size: 78px; white-space: nowrap; line-height: 1; margin: 16px 0 10px; }
  .inc h3 { font-size: 42px; }
  .inc p { font-size: 24px; color: var(--ink-soft); margin: 12px 0 0; line-height: 1.45; }
  .word { display: inline-block; opacity: 0; margin-right: .26em; }
  .bul { display: grid; grid-template-columns: 70px 1fr; gap: 18px; align-items: start; }
  .bul h3 { font-size: 44px; }
  .bul p { font-size: 25px; color: var(--ink-soft); margin: 10px 0 0; line-height: 1.45; }
</style>
<script src="ink.js"></script>
<script src="figs.js"></script>
</head>
<body>
<div id="lab"></div>
<script>
const W = 1920, H = 1080;
const tiny = (inner, w, h) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="overflow:visible">${ink.defs()}${inner}</svg>`;
const NIB = (size) => tiny(ink.nib(0, 0, size, C.cobalt, true), size, size);
const BRUSH = (w) => tiny(ink.brush(0, 0, w), w, w * 0.16);
const ICON = (name, size = 64, color = C.cobalt) => tiny(ink.icon(name, 0, 0, size, color, 1.7), size, size);

// Each clip: html, duration in ms (play time before the freeze)
const CLIPS = {
  P01: { label: 'Title', ms: 4500, html: `<div class="center">
      <div data-s="0" data-draw>${NIB(330)}</div>
      <h1 data-s="2" style="font-size:150px">Countersign</h1>
      <div data-s="3" data-draw>${BRUSH(420)}</div>
      <p data-s="4" style="font-family:var(--display);font-size:52px">Sign only what you can read.</p></div>` },

  P02: { label: 'The question', ms: 10000, html: `<div class="pad">
      <p data-s="0" class="eyebrow" style="font-size:20px">The organiser's own banking agent brief</p>
      <h2 data-s="1" style="font-size:84px;margin:18px 0 50px">What should an AI agent be allowed to sign for you?</h2>
      <div data-s="2" class="tier"><b class="cobalt">Green</b><span>Automatic: balance and information queries</span></div>
      <div data-s="3" class="tier"><b class="ochre">Yellow</b><span>User confirmation: small transfers</span></div>
      <div data-s="4" class="tier" style="border:3px solid var(--vermilion)"><b class="vermilion">Red</b><span>Strong verification: <b style="font-family:Inter;font-size:32px">investment subscription</b></span></div>
      <p data-s="6" style="font-family:var(--display);font-size:48px;margin-top:46px">The hard part is not talking about an investment. <span class="cobalt">It is buying one.</span></p>
      <p data-s="6" class="source" style="font-size:18px;margin-top:14px">Source: 2026 FinTechathon, Domestic AI Track brief.</p></div>` },

  P03: { label: 'Her day', ms: 11500, fig: 'fig-persona' },

  P04: { label: 'What has gone wrong', ms: 10500, html: `<div class="pad">
      <p data-s="0" class="eyebrow" style="font-size:20px">What has already gone wrong</p>
      <h2 data-s="0" style="font-size:80px;margin:18px 0 50px">A refusal written in a prompt does not hold money</h2>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:40px">
        <div data-s="1" class="inc">${ICON('chat')}<div class="big">13.19 ETH</div><h3>Freysa</h3><p>Talked into a transfer by a chat instruction, after 482 messages.</p><p class="source" style="font-size:17px">Source: Simon Willison</p></div>
        <div data-s="3" class="inc">${ICON('server')}<div class="big">55.5 ETH</div><h3>AIXBT</h3><p>Drained through the operator's panel.</p><p class="source" style="font-size:17px">Source: AI Incident Database 1003</p></div>
        <div data-s="5" class="inc" style="border:3px solid var(--vermilion)">${ICON('eye', 64, C.vermilion)}<div class="big">~US$1.5bn</div><h3>Bybit</h3><p>A signing screen that showed one thing while the transaction did another.</p><p class="source" style="font-size:17px">Source: Bloomberg</p></div>
      </div></div>` },

  P05: { label: 'The one line', ms: 10000, html: `<div class="pad" style="display:grid;grid-template-columns:1.25fr .75fr;gap:60px;align-items:center">
      <div><p data-s="0" class="eyebrow" style="font-size:20px;margin-bottom:24px">So we built</p>
      <h2 style="font-size:84px;line-height:1.12" data-words>An AI agent that invests for you in receivables funds, with every decision and every purchase traceable on chain.</h2></div>
      <div style="position:relative;height:640px">
        <div data-s="0" data-draw style="position:absolute;left:30px;top:20px">${NIB(560)}</div>
        <div data-s="6" style="position:absolute;left:-60px;top:230px;font-family:var(--display);font-style:italic;font-size:34px" class="cobalt">her mandate</div>
        <div data-s="9" style="position:absolute;left:470px;top:230px;font-family:var(--display);font-style:italic;font-size:34px" class="cobalt">the issuer</div>
        <div data-s="13" style="position:absolute;left:150px;top:600px;font-family:var(--display);font-style:italic;font-size:34px" class="cobalt">a wallet contract</div>
      </div></div>` },

  P06: { label: 'Three parties', ms: 11500, fig: 'fig-actors' },
  P15: { label: 'The attack suite', ms: 8500, fig: 'fig-adversarial' },
  P18a: { label: 'Tasks', ms: 7000, fig: 'fig-benign' },
  P18b: { label: 'Evidence', ms: 6500, fig: 'fig-evidence' },
  P12: { label: 'Decision on chain', ms: 7500, fig: 'fig-decision' },

  P19: { label: 'Compliance', ms: 9000, html: `<div class="pad">
      <p data-s="0" class="eyebrow" style="font-size:20px">Compliance, before you ask</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:56px 80px;margin-top:40px">
        <div data-s="1" class="bul">${ICON('globe')}<div><h3>Perimeter</h3><p>Not offered in Mainland China. We name the February 2026 notice, Yinfa [2026] No. 42.</p></div></div>
        <div data-s="3" class="bul">${ICON('scale')}<div><h3>No licence</h3><p>A production deployment would need licensed partners and local authorisation.</p></div></div>
        <div data-s="5" class="bul">${ICON('person')}<div><h3>Simulated checks</h3><p>KYC/KYB, suitability and the perimeter are simulated. Test assets only.</p></div></div>
        <div data-s="7" class="bul">${ICON('lock')}<div><h3>What the model sees</h3><p>Her messages and typed tool results; addresses, keys, e-mails and tokens removed first.</p></div></div>
      </div>
      <p data-s="9" style="font-family:var(--display);font-size:40px;margin-top:56px">No return figure, anywhere.</p></div>` },

  PV: { label: 'Validation', ms: 10500, html: `<div class="pad">
      <p data-s="0" class="eyebrow" style="font-size:20px">Validation, n = 2</p>
      <h2 data-s="0" style="font-size:72px;margin:14px 0 40px">Two people used it on the testnet app</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:40px">
        <div data-s="1" class="inc">${ICON('person')}<h3 style="margin-top:12px">An investor</h3><div class="big cobalt">9 of 9</div><p style="font-size:28px">tasks unaided; 4 of 5 card questions right without looking</p><p data-s="4" style="font-family:var(--display);font-size:32px;color:var(--navy);margin-top:18px">"For the first time I know what I am signing."</p></div>
        <div data-s="2" class="inc">${ICON('bank')}<h3 style="margin-top:12px">A fund operations analyst</h3><div class="big cobalt">4 of 5</div><p style="font-size:28px">tasks unaided, 1 with a pointer</p><p data-s="6" style="font-family:var(--display);font-size:32px;color:var(--navy);margin-top:18px">"The agent does not choose where the money goes."</p></div>
      </div>
      <p data-s="8" class="source" style="font-size:20px;margin-top:28px">Exploratory, moderated usability sessions, October 2026; not statistically meaningful.</p></div>` },

  P21: { label: 'Close', ms: 4000, html: `<div class="center">
      <div data-s="0" data-draw>${NIB(300)}</div>
      <h1 data-s="2" style="font-size:120px">Sign only what you can read.</h1>
      <div data-s="3" data-draw>${BRUSH(520)}</div>
      <p data-s="4" class="soft" style="font-size:26px">Countersign · test assets on the Stellar test network · our contracts are not audited</p></div>` },
};

const lab = document.getElementById('lab');
const solo = new URLSearchParams(location.search).get('clip');
if (solo) document.body.classList.add('solo');

for (const [id, c] of Object.entries(CLIPS)) {
  if (solo && solo !== id) continue;
  const el = document.createElement('div');
  el.className = 'clip'; el.id = id;
  el.innerHTML = `<div class="label">${id} · ${c.label}</div>` + (c.fig ? `<div class="fig">${FIGS[c.fig]()}</div>` : c.html);
  lab.appendChild(el);
  // Split a sentence into words that appear one after another
  el.querySelectorAll('[data-words]').forEach((h) => {
    h.innerHTML = h.textContent.split(' ').map((w) => `<span class="word">${w}</span>`).join('');
  });
  // Figures: every top level mark of the drawing becomes a step
  if (c.fig) {
    const svgEl = el.querySelector('.fig svg');
    svgEl.removeAttribute('width'); svgEl.removeAttribute('height');
    const kids = [...svgEl.children].filter((k) => k.tagName !== 'defs').slice(1);
    kids.forEach((k, i) => { k.setAttribute('data-s', String(i)); k.setAttribute('data-draw', ''); });
  }
}

/** Draw a stroke in: every path inside gets a dash that runs to zero */
function draw(node, delay, dur) {
  node.querySelectorAll('path').forEach((p) => {
    if (p.getAttribute('stroke-dasharray') || p.closest('[stroke-dasharray]')) return;
    p.setAttribute('pathLength', '1');
    p.style.strokeDasharray = '1';
    p.style.strokeDashoffset = '1';
    p.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: dur, delay, fill: 'forwards', easing: 'cubic-bezier(.22,.72,.2,1)' });
  });
}

function play(id) {
  const c = CLIPS[id];
  const el = document.getElementById(id);
  const steps = [...el.querySelectorAll('[data-s]')];
  const max = Math.max(...steps.map((s) => Number(s.dataset.s)), 1);
  const span = c.ms * 0.78;
  steps.forEach((s) => {
    const d = (Number(s.dataset.s) / max) * span;
    s.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 520, delay: d, fill: 'forwards', easing: 'ease-out' });
    if (s.hasAttribute('data-draw')) draw(s, d, Math.min(1400, Math.max(700, span / max)));
  });
  const words = [...el.querySelectorAll('.word')];
  words.forEach((w, i) => w.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, delay: 300 + i * ((c.ms * 0.7) / words.length), fill: 'forwards' }));
  return c.ms;
}

window.lab = { ids: Object.keys(CLIPS), play };
</script>
</body>
</html>
